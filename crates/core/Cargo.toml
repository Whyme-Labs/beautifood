[package]
name = "bf-core"
version = "0.1.0"
edition = "2021"
description = "Beautifood domain core: pricing, bill splitting, table assignment, wait estimation, turn-time model. Compiled to WASM for Workers and browsers."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
