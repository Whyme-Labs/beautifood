name: Guest assistant eval

# Scores small models on what we promise guests (src/shared/assistantEval.ts): each model alone,
# and the assistant as deployed (rules engine first, the model for the rest, the allergen guard).
# The models run on the live Worker's own Workers AI binding: the job sets a one-off EVAL_KEY
# secret on the Worker, asks routes/api/internal/assistant-eval each question, then replaces the
# key with one nobody knows. Results are in the job summary and the assistant-eval artifact.
#
# Manual only: it runs models on our Workers AI bill, and guests' AI runs on their own devices.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Workers AI models, comma-separated
        default: "@cf/google/gemma-4-26b-a4b-it,@cf/qwen/qwen3.8-27b,@cf/deepseek-ai/deepseek-v4-flash-0731,@cf/meta/llama-3.1-8b-instruct-fp8-fast"

permissions:
  contents: read
  actions: read # to wait for this commit's deploy

# one at a time: each run owns the Worker's EVAL_KEY while it runs
concurrency:
  group: assistant-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVAL_URL: https://${{ vars.APP_DOMAIN || 'app.beautifood.io' }}
      EVAL_MODELS: ${{ inputs.models || '@cf/google/gemma-4-26b-a4b-it,@cf/qwen/qwen3.8-27b,@cf/deepseek-ai/deepseek-v4-flash-0731,@cf/meta/llama-3.1-8b-instruct-fp8-fast' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # generated config (.void/tsconfig.json) the TypeScript transform reads
      - run: npx void prepare
      - name: Wait for this commit's deploy
        # the eval must score the code it ships with, not the version still live before the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            state=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" --jq '[.workflow_runs[] | select(.name == "CI & Deploy")][0] | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") echo "deployed"; exit 0 ;;
              completed*) echo "::error::The deploy for this commit didn't succeed ($state)"; exit 1 ;;
              "null null"|"") if [ "$i" -gt 6 ]; then echo "No deploy runs for this commit (nothing to wait for)"; exit 0; fi ;;
            esac
            sleep 20
          done
          echo "::error::The deploy didn't finish in 30 minutes"; exit 1
      - name: One-off key on the Worker
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "EVAL_KEY=$key" >> "$GITHUB_ENV"
          curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/beautifood-app/secrets" \
            -d "$(jq -n --arg v "$key" '{name:"EVAL_KEY", text:$v, type:"secret_text"}')" | jq -c '{success, errors}'
      - name: Wait for the Worker to take it
        # a deploy from the same push may still be rolling out the eval route
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "x-eval-key: $EVAL_KEY" -H "content-type: application/json" -d '{}' "$EVAL_URL/api/internal/assistant-eval")
            # 400 = the key is accepted and the (empty) question refused
            if [ "$code" = "400" ]; then echo "ready"; exit 0; fi
            sleep 10
          done
          echo "::error::The eval route never accepted the key (last status $code)"; exit 1
      - name: Score the models
        run: npx vitest run --config vitest.eval.config.ts
      - name: Replace the key
        if: always()
        run: |
          curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/beautifood-app/secrets" \
            -d "$(jq -n --arg v "$(openssl rand -hex 32)" '{name:"EVAL_KEY", text:$v, type:"secret_text"}')" | jq -c '{success, errors}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-eval
          path: test-results/assistant-eval.json
          if-no-files-found: ignore
