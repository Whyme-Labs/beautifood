name: CI & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Rust, unit, typecheck, Playwright)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Void types
        run: pnpm exec void prepare
      - name: Rust core tests
        run: cargo test --manifest-path crates/core/Cargo.toml
      - name: Unit tests
        run: pnpm test:unit
      - name: Typecheck
        run: pnpm typecheck
      - name: Taste service tests (Qloo harness behind HTTPS)
        run: npm ci --prefix services/taste --no-audit --no-fund && npm test --prefix services/taste
      - name: Taste service's Cloudflare Worker typechecks
        run: npm ci --prefix services/taste/cloudflare --no-audit --no-fund && npm run typecheck --prefix services/taste/cloudflare
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (production build, fresh D1)
        run: pnpm exec playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        # Only failures need the report; storage quota must never fail the build.
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/e2e.json
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.url.outputs.public }}
    permissions:
      contents: write # commit void.lock.json after the first deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Sender for Cloudflare Email Sending (override with the MAIL_FROM repository variable).
      MAIL_FROM: ${{ vars.MAIL_FROM || 'Beautifood <noreply@beautifood.io>' }}
      # Bind Workers AI so menus translate without an Anthropic key.
      BEAUTIFOOD_WORKERS_AI: "1"
      # The app's own address (a Workers Custom Domain, see void.config.ts); links point at it.
      APP_DOMAIN: ${{ vars.APP_DOMAIN || 'app.beautifood.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workers subdomain
        id: sub
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          echo "subdomain=$sub" >> "$GITHUB_OUTPUT"
      - name: Guard against touching another app's resources
        # The account also hosts an older "beautifood" app with live users. Refuse to deploy
        # if our target Worker or database exists but does not look like ours.
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          ours_db=0
          db=$(curl -fsS "${auth[@]}" "$api/d1/database?name=beautifood-app-db" | jq -c '[.result[] | select(.name == "beautifood-app-db")][0] // empty')
          if [ -n "$db" ]; then
            id=$(echo "$db" | jq -r .uuid)
            applied=$(curl -fsS "${auth[@]}" -H "content-type: application/json" -X POST "$api/d1/database/$id/query" \
              -d '{"sql":"SELECT name FROM d1_migrations"}' | jq -r '.result[0].results[]?.name' || true)
            for m in $applied; do
              if [ ! -f "db/migrations/$m" ]; then echo "::error::beautifood-app-db has migration $m that is not ours; refusing to deploy"; exit 1; fi
            done
            echo "beautifood-app-db exists and its migration history is ours"
            ours_db=1
          else
            echo "beautifood-app-db does not exist yet; Void will create it"
          fi
          if curl -fsS "${auth[@]}" "$api/workers/scripts" | jq -e '.result[] | select(.id == "beautifood-app")' >/dev/null; then
            if [ ! -f void.lock.json ] && [ "$ours_db" != 1 ]; then echo "::error::A Worker named beautifood-app already exists and nothing shows it is ours; refusing to overwrite it"; exit 1; fi
            echo "Worker beautifood-app exists and is ours"
          else
            echo "Worker beautifood-app does not exist yet"
          fi
      - name: Keyring tool for the Cloudflare CLI
        # Void's email checks run Cloudflare's `cf` CLI in keyring mode, which needs secret-tool.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-tools
      - name: Deploy (Worker, D1 + migrations, queue, cron, email)
        id: deploy
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ steps.sub.outputs.subdomain }}
        run: |
          set -o pipefail
          flags="--platform cloudflare"
          # Once the one-time "Email setup" workflow has recorded email in void.lock.json, insist on it.
          if [ -f void.lock.json ] && grep -q '"email"' void.lock.json; then flags="$flags --require-email"; fi
          # mask email addresses (Cloudflare account names often contain one; this log is public)
          pnpm exec void deploy $flags 2>&1 | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<email>/g' | tee deploy.log
      - name: Public URL
        id: url
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | grep -v -- '-[0-9a-f]\{8\}\.' | head -1)
          if [ -z "$url" ]; then url="https://beautifood-app.${{ steps.sub.outputs.subdomain }}.workers.dev"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          public=$url
          if [ -n "$APP_DOMAIN" ]; then public="https://$APP_DOMAIN"; fi
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "Deployed to $public ($url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Point links at the public URL
        # PUBLIC_URL is what emails, pushes and QR codes link to. Set it once as a Worker secret
        # (Void keeps existing remote secrets on later deploys).
        run: |
          curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/beautifood-app/secrets" \
            -d "$(jq -n --arg v "${{ steps.url.outputs.public }}" '{name:"PUBLIC_URL", text:$v, type:"secret_text"}')" | jq -c '{success, errors}'
      - name: Guest assistant model
        # The small model behind the guest assistant, for what the rules engine can't answer
        # (scored by the "Guest assistant eval" workflow). Off by default so the AI bill can't grow
        # with traffic: guests get the free rules engine, and AI only where their own device can run
        # it. Set the ASSISTANT_PROVIDER repository variable (e.g. workers-ai) to turn it on.
        env:
          PROVIDER: ${{ vars.ASSISTANT_PROVIDER || 'off' }}
          MODEL: ${{ vars.ASSISTANT_MODEL || '@cf/meta/llama-3.1-8b-instruct-fp8-fast' }}
        run: |
          for kv in "ASSISTANT_PROVIDER=$PROVIDER" "ASSISTANT_MODEL=$MODEL"; do
            curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/beautifood-app/secrets" \
              -d "$(jq -n --arg n "${kv%%=*}" --arg v "${kv#*=}" '{name:$n, text:$v, type:"secret_text"}')" | jq -c '{success, errors}'
          done
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ steps.url.outputs.url }}/api/health" | grep -q '"ok":true'; then break; fi
            sleep 5
          done
          curl -fsS "${{ steps.url.outputs.url }}/api/health"
          # dev tools must be off in production
          test "$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.url.outputs.url }}/api/dev/inbox")" = "404"
      - name: App domain answers
        if: env.APP_DOMAIN != ''
        # A new custom domain's certificate takes a few minutes the first time.
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -m 10 "https://$APP_DOMAIN/api/health" 2>/dev/null | grep -q '"ok":true'; then echo "https://$APP_DOMAIN is live"; exit 0; fi
            sleep 15
          done
          echo "::warning::https://$APP_DOMAIN isn't answering yet (certificate still issuing?); links already point at it"
          curl -sS -m 10 -o /dev/null -w "%{http_code}\n" "https://$APP_DOMAIN/api/health" || true
      - name: Commit lock file
        if: always() && steps.deploy.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain void.lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add void.lock.json
            git commit -m "chore: record Cloudflare resources (void.lock.json) [skip ci]"
            git pull --rebase && git push
          fi
